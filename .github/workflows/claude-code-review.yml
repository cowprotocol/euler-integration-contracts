name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      statuses: write
    uses: cowprotocol/claude-review/.github/workflows/claude-review.yml@d224a33b575e0fe2bcffcaab41c5bce052ecdc03 # add codeowners and linters
    with:
      # Tools for comprehensive PR review
      extra_allowed_tools: Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
